<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Солнечная Долина — 3D-бутылка «Чёрный Доктор»</title>
<meta name="description" content="R&D: настоящая 3D-бутылка в браузере вместо видео-турнтейбла. Геометрия снята с силуэта, этикетка развёрнута с фото, стекло — MeshPhysicalMaterial с transmission и картой толщины.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23090807%22/><text x=%2250%22 y=%2266%22 font-size=%2248%22 text-anchor=%22middle%22 fill=%22%23b99b63%22 font-family=%22Georgia%22>СД</text></svg>">
<link rel="stylesheet" href="../assets/fonts/fonts.css">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #f4ece0;
    --mute: rgba(244, 236, 224, .46);
    --gold: #b99b63;
  }

  html { background: #000; }
  body {
    background: #000;
    color: var(--ink);
    font-family: 'Cormorant', Georgia, serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── сцена: контейнер, канвас модуль создаёт сам ─────────────────────── */
  .stage {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    z-index: 0;
  }

  /* прокрутка крутит бутылку: полный оборот за 4 экрана */
  .scroll { height: 400vh; position: relative; z-index: 1; pointer-events: none; }

  /* ── прелоадер ───────────────────────────────────────────────────────── */
  .pre {
    position: fixed; inset: 0; z-index: 40;
    background: #000;
    display: grid; place-content: center; gap: .8rem;
    text-align: center;
    transition: opacity .7s ease, visibility .7s;
  }
  .pre.off { opacity: 0; visibility: hidden; pointer-events: none; }
  .pre p {
    font-size: .78rem; letter-spacing: .34em; text-transform: uppercase;
    color: var(--mute); font-family: system-ui, sans-serif;
  }
  .pre__dot {
    width: 3px; height: 3px; border-radius: 50%; background: var(--gold);
    margin: 0 auto; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .25; transform: scale(1); } 50% { opacity: 1; transform: scale(2.4); } }

  /* ── две строки слева ────────────────────────────────────────────────── */
  .lead {
    position: fixed; z-index: 20;
    left: clamp(1.6rem, 5.2vw, 5.6rem);
    top: 50%; transform: translateY(-50%);
    max-width: 22ch;
    pointer-events: none;
    transition: opacity .6s ease, transform .6s ease;
  }
  .lead__1 {
    display: block;
    font-size: clamp(2.1rem, 4.3vw, 4.1rem);
    line-height: 1.02; font-weight: 300; letter-spacing: -.012em;
  }
  .lead__2 {
    display: block; margin-top: .55rem;
    font-size: clamp(1rem, 1.55vw, 1.5rem);
    line-height: 1.35; font-weight: 300; font-style: italic;
    color: var(--mute);
  }
  .is-zoom .lead { opacity: 0; transform: translateY(-50%) translateX(-1.4rem); }

  /* ── переключатель видов ─────────────────────────────────────────────── */
  .views {
    position: fixed; z-index: 25;
    left: clamp(1.6rem, 5.2vw, 5.6rem);
    bottom: clamp(1.8rem, 6vh, 4.2rem);
    display: flex; gap: .5rem;
  }
  .views button {
    padding: .74rem 1.5rem;
    border: 1px solid rgba(185, 155, 99, .3);
    border-radius: 999px;
    background: rgba(255, 255, 255, .015);
    backdrop-filter: blur(6px);
    color: var(--mute);
    font-family: system-ui, sans-serif;
    font-size: .66rem; letter-spacing: .2em; text-transform: uppercase;
    cursor: pointer;
    transition: border-color .3s, background .3s, color .3s;
  }
  .views button:hover { border-color: rgba(185, 155, 99, .8); color: var(--ink); }
  .views button.is-on {
    border-color: rgba(185, 155, 99, .95);
    background: rgba(185, 155, 99, .12);
    color: var(--ink);
  }

  /* ── служебное ───────────────────────────────────────────────────────── */
  .hud {
    position: fixed; z-index: 25;
    right: clamp(1rem, 3vw, 2.4rem); top: clamp(1rem, 3vh, 2rem);
    font-family: ui-monospace, monospace; font-size: .62rem;
    letter-spacing: .1em; color: rgba(244, 236, 224, .3);
  }
  .hint {
    position: fixed; z-index: 25;
    right: clamp(1rem, 3vw, 2.4rem); bottom: clamp(1.8rem, 6vh, 4.2rem);
    font-family: system-ui, sans-serif; font-size: .62rem;
    letter-spacing: .16em; text-transform: uppercase;
    color: rgba(244, 236, 224, .26); text-align: right; line-height: 2;
    transition: opacity .5s;
  }
  .is-zoom .hint { opacity: 0; }

  @media (max-width: 820px) {
    .lead { top: auto; bottom: 9.5rem; transform: none; }
    .is-zoom .lead { transform: translateX(-1.4rem); }
    .views { left: 50%; transform: translateX(-50%); gap: .35rem; }
    .views button { padding: .62rem 1rem; font-size: .58rem; letter-spacing: .14em; }
    .hint { display: none; }
  }
</style>
</head>
<body>

<div class="pre" id="pre">
  <div class="pre__dot"></div>
  <p>Чёрный Доктор · 2017</p>
</div>

<div class="stage" id="stage"></div>

<p class="lead">
  <span class="lead__1">Чёрный Доктор</span>
  <span class="lead__2">Эким Кара с южного склона Токлук-Сарая. Сорок гектаров, которых нет больше нигде.</span>
</p>

<div class="views">
  <button type="button" data-view="front">Фронт</button>
  <button type="button" data-view="turn">Оборот</button>
  <button type="button" data-view="zoom">Наезд</button>
</div>

<div class="hud"><span id="fps">— fps</span></div>
<p class="hint">Прокрутка — поворот<br>Курсор — свет и наклон</p>

<div class="scroll" aria-hidden="true"></div>

<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/vendor/ScrollTrigger.min.js"></script>
<script src="../assets/vendor/lenis.min.js"></script>

</body>
</html>
